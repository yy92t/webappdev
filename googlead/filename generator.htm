<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Filename Generator</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom focus styles for better visibility */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6 !important; /* blue-500 */
            box-shadow: 0 0 0 2px #bfdbfe; /* blue-100 */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Filename Generator Card -->
    <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
            Smart Filename Generator
        </h1>
        <p class="text-center text-gray-600 mb-8">
            Create consistent, safe, and sortable filenames based on best practices.
        </p>

        <div class="space-y-6">
            <!-- SECTION 0: Gemini Smart Suggest -->
            <!-- This section has been removed as requested -->

            <!-- SECTION 1: File Components -->
            <fieldset class="border border-gray-300 rounded-lg p-4">
                <legend class="text-lg font-semibold text-gray-700 px-2">1. File Components</legend>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                    <!-- Main Description -->
                    <div>
                        <label for="client" class="block text-sm font-medium text-gray-700 mb-1">Client <span class="text-red-500">*</span></label>
                        <input type="text" id="client" placeholder="e.g., Acme Inc, John Doe" required
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-700 shadow-sm focus:border-blue-500">
                    </div>
                    <!-- Category / Project -->
                    <div>
                        <label for="mainDesc" class="block text-sm font-medium text-gray-700 mb-1">Main Description</label>
                        <input type="text" id="mainDesc" placeholder="e.g., Project Report, Resume"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-700 shadow-sm focus:border-blue-500">
                    </div>
                    <!-- Version / Number -->
                    <div>
                        <label for="version" class="block text-sm font-medium text-gray-700 mb-1">Version / Number</label>
                        <input type="text" id="version" placeholder="e.g., v01, 001, v2"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-700 shadow-sm focus:border-blue-500">
                    </div>
                    <!-- Status -->
                    <div>
                        <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                        <input type="text" id="status" placeholder="e.g., draft, final, signed"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-700 shadow-sm focus:border-blue-500">
                    </div>
                </div>
            </fieldset>

            <!-- SECTION 2: Naming Options -->
            <fieldset class="border border-gray-300 rounded-lg p-4">
                <legend class="text-lg font-semibold text-gray-700 px-2">2. Naming Options</legend>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                    <!-- Separator -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Separator</label>
                        <div class="flex space-x-4">
                            <label class="flex items-center">
                                <input type="radio" name="separator" value="-" checked class="h-4 w-4 text-blue-600 border-gray-300">
                                <span class="ml-2 text-gray-700">Hyphen (kebab-case)</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="separator" value="_" class="h-4 w-4 text-blue-600 border-gray-300">
                                <span class="ml-2 text-gray-700">Underscore (snake_case)</span>
                            </label>
                        </div>
                    </div>
                    <!-- Case -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Case Style</label>
                        <div class="flex space-x-4">
                            <label class="flex items-center">
                                <input type="radio" name="case" value="lowercase" checked class="h-4 w-4 text-blue-600 border-gray-300">
                                <span class="ml-2 text-gray-700">lowercase</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="case" value="UPPERCASE" class="h-4 w-4 text-blue-600 border-gray-300">
                                <span class="ml-2 text-gray-700">UPPERCASE</span>
                            </label>
                        </div>
                    </div>
                    <!-- Date -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Date (for sorting)</label>
                        <label class="flex items-center">
                            <input type="checkbox" id="includeDate" class="h-4 w-4 text-blue-600 border-gray-300 rounded">
                            <span class="ml-2 text-gray-700">Add Today's Date (YYYY-MM-DD)</span>
                        </label>
                    </div>
                    <!-- Extension -->
                    <div>
                        <label for="extension" class="block text-sm font-medium text-gray-700 mb-1">File Extension</label>
                        <input type="text" id="extension" value="pdf"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-gray-700 shadow-sm focus:border-blue-500">
                    </div>
                </div>
            </fieldset>

            <!-- Generate Button -->
            <button id="generateBtn"
                    class="w-full bg-blue-600 text-white py-3 px-6 rounded-lg text-lg font-semibold shadow-md
                           hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50
                           transition duration-200">
                Generate Filename
            </button>

            <!-- Result Area -->
            <div id="resultArea" class="hidden space-y-3">
                <label class="block text-sm font-medium text-gray-700">Generated Filename:</label>
                <div class="bg-gray-100 p-4 rounded-lg flex items-center justify-between space-x-4">
                    <code id="resultFilename" class="text-gray-800 font-mono text-lg break-all"></code>
                    <button id="copyBtn" title="Copy to Clipboard"
                            class="flex-shrink-0 bg-gray-200 hover:bg-gray-300 text-gray-700 p-2 rounded-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2V9a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </button>
                </div>
                <span id="copyMsg" class="text-green-600 text-sm font-medium hidden">Copied to clipboard!</span>
                <span id="errorMsg" class="text-red-600 text-sm font-medium hidden">Client is required.</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script id="appLogic">
        // --- Main Filename Generator Elements ---
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const resultArea = document.getElementById('resultArea');
        const resultFilename = document.getElementById('resultFilename');
        const copyMsg = document.getElementById('copyMsg');
        const errorMsg = document.getElementById('errorMsg');

        // --- Gemini API Elements ---
        // Removed as requested

        // Input fields to populate
        const clientInput = document.getElementById('client');
        const mainDescInput = document.getElementById('mainDesc');
        const statusInput = document.getElementById('status');


        // --- Slugify Function ---
        // Converts any string into a safe, usable filename part
        function slugify(text, separator) {
            if (!text) return "";
            return text
                .toString()
                .normalize('NFD') // Remove accents
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9\s-]/g, '') // Remove special chars
                .replace(/[\s_-]+/g, separator) // Replace spaces/underscores with separator
                .trim(separator); // Remove leading/trailing separators
        }

        // --- Generate Filename Logic ---
        function generateFilename() {
            // 1. Get all values
            const client = clientInput.value;
            const mainDesc = mainDescInput.value;
            const version = document.getElementById('version').value;
            const status = statusInput.value;
            const extension = document.getElementById('extension').value.replace(/^\./, ''); // Remove leading dot
            
            const separator = document.querySelector('input[name="separator"]:checked').value;
            const caseType = document.querySelector('input[name="case"]:checked').value;
            const includeDate = document.getElementById('includeDate').checked;

            // 2. Clear previous messages
            errorMsg.classList.add('hidden');
            copyMsg.classList.add('hidden');

            // 3. Validate required fields
            if (!client.trim()) {
                errorMsg.classList.remove('hidden');
                resultArea.classList.add('hidden');
                return;
            }

            // 4. Build filename parts
            const parts = [];

            // Add date first for sorting
            if (includeDate) {
                const d = new Date();
                const dateStr = [
                    d.getFullYear(),
                    ('0' + (d.getMonth() + 1)).slice(-2), // Pad month
                    ('0' + d.getDate()).slice(-2)      // Pad day
                ].join('-'); // Use hyphen for date standard
                parts.push(dateStr);
            }

            // Add other parts, slugifying them
            parts.push(slugify(mainDesc, separator));
            parts.push(slugify(client, separator));
            parts.push(slugify(status, separator));
            parts.push(slugify(version, separator));

            // 5. Join, clean, and apply case
            let baseName = parts.filter(Boolean).join(separator); // Filter out empty strings
            
            // Clean up double separators (if any)
            baseName = baseName.replace(new RegExp(separator + '{2,}', 'g'), separator);

            if (caseType === 'UPPERCASE') {
                baseName = baseName.toUpperCase();
            }
            // Note: 'lowercase' is already handled by slugify

            // 6. Add extension
            const finalName = extension ? `${baseName}.${extension}` : baseName;

            // 7. Display result
            resultFilename.textContent = finalName;
            resultArea.classList.remove('hidden');
        }

        // --- Copy to Clipboard Logic ---
        function copyToClipboard() {
            const text = resultFilename.textContent;

            // Use fallback for browser/iframe compatibility
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'absolute';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            
            ta.select();
            try {
                document.execCommand('copy');
                copyMsg.classList.remove('hidden');
                setTimeout(() => copyMsg.classList.add('hidden'), 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
            document.body.removeChild(ta);
        }

        // --- Gemini API Call Logic ---
        // Removed as requested

        // --- Event Listeners ---
        generateBtn.addEventListener('click', generateFilename);
        copyBtn.addEventListener('click', copyToClipboard);
        // geminiSuggestBtn.addEventListener('click', handleGeminiSuggest); // New listener - Removed
    </script>
</body>
</html>
